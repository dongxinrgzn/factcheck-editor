name = "factcheck-editor-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 硬编码 account_id，跳过 /memberships API（wrangler 3.x + API Token 的已知 Bug）
account_id = "671a2f0bf367dfe29abb0db9036e872b"

# 自定义域名（必须在 [vars] 之前定义！）
# custom_domain = true：Cloudflare 自动创建 DNS 记录 + SSL 证书
routes = [
  { pattern = "factcheck.mymili.top", custom_domain = true }
]

# 4 个 KV 命名空间（已通过 Cloudflare API 创建）
[[kv_namespaces]]
binding = "FACT_CACHE"
id = "11b227db38e742db944bf4a7fcea5ffa"

[[kv_namespaces]]
binding = "SESSION_STATE"
id = "372560eb50454cedade677dcab669195"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6564e7ee32574a7fb15f3d8c4902c9d6"

[[kv_namespaces]]
binding = "FACT_KB"
id = "112efd0ff26c40c08b008fb602047f15"

[vars]
LLM_PROVIDER = "siliconflow"
LLM_MODEL = "Qwen/Qwen2.5-72B-Instruct"
CTEXT_RATE_LIMIT_MS = "1100"
FALLBACK_PER_IP_DAILY_LIMIT = "3"
OFFICIAL_WHITELIST = '["stats.gov.cn","data.stats.gov.cn","nfga.gov.cn","moe.gov.cn","gov.cn","openstd.samr.gov.cn","baike.baidu.com","zh.wikipedia.org"]'

# 踩坑警告：
# 1. routes 必须在 [vars] 之前定义，否则 wrangler 4.x 会把 routes 当环境变量
# 2. 先 wrangler deploy 再 wrangler secret put（否则 PowerShell TTY 报错）
# 3. Node 20 用 wrangler@^3；Node 22+ 可用 4.x
