<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>事实查询</title>
<style>
:root {
  --bg: #f5f7fa;
  --panel: #fff;
  --border: #e1e4e8;
  --text: #24292e;
  --muted: #6a737d;
  --accent: #0366d6;
  --green: #28a745;
  --yellow: #b8860b;
  --red: #d73a49;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

/* 顶栏 */
.topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar .config { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar input { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; width: 200px; }
.topbar button, .btn-secondary { padding: 4px 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 4px; cursor: pointer; font-size: 13px; }
.topbar button:hover, .btn-secondary:hover { background: #f0f0f0; }
.btn-primary { padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.btn-primary:hover { opacity: .9; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

/* 三栏 */
.main { display: grid; grid-template-columns: 38% 28% 34%; gap: 1px; background: var(--border); height: calc(100vh - 48px); }
.panel { background: var(--panel); padding: 16px; overflow-y: auto; }
.panel h2 { font-size: 14px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* 左栏 */
.text-input { flex: 1; display: flex; flex-direction: column; }
.text-input textarea { flex: 1; min-height: 180px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 14px; resize: none; }
.mode-tabs { display: flex; gap: 8px; margin: 8px 0; }
.mode-tabs label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }

/* 知识库列表 */
.kb-entry-list { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 8px; }
.kb-entry-list h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.kb-entry-item { padding: 4px 8px; cursor: pointer; border-radius: 4px; }
.kb-entry-item:hover { background: #f0f0f0; }

/* 中栏：检索结果 */
.result-item { padding: 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; }
.result-item .title { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.result-item .title a { color: var(--accent); text-decoration: none; }
.result-item .title a:hover { text-decoration: underline; }
.result-item .snippet { color: var(--muted); font-size: 13px; margin-top: 4px; }
.tag-official { background: var(--green); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }
.tag-unofficial { background: #999; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

/* 右栏：核查报告 */
.report-summary { padding: 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 12px; background: #fafbfc; }
.report-summary .rating { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.rating-high { background: #e6f4ea; color: var(--green); }
.rating-medium { background: #fff8e1; color: var(--yellow); }
.rating-low { background: #ffebee; color: var(--red); }
.report-summary .stats { font-size: 13px; color: var(--muted); }

/* 每条断言 */
.claim-item { border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
.claim-item .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.claim-item .source-tag { font-size: 11px; color: var(--muted); margin-left: 6px; }
.claim-item .claim-text { margin-top: 4px; font-weight: 600; }
.claim-item .evidence { margin-top: 6px; color: var(--text); font-size: 13px; }
.claim-item .sources { margin-top: 6px; }
.claim-item .sources a { color: var(--accent); font-size: 12px; text-decoration: none; display: inline-block; margin: 2px 6px 2px 0; }
.claim-item .sources a:hover { text-decoration: underline; }

/* 入库状态（每条下方独立） */
.store-status { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); font-size: 13px; }
.store-status .btn-store { padding: 3px 10px; font-size: 12px; margin-left: 6px; border: 1px solid var(--border); border-radius: 3px; background: var(--panel); cursor: pointer; }
.store-status .btn-store:hover { background: #f0f0f0; }
.store-status .btn-store.no { color: #999; }
.store-status .stored { color: var(--green); }
.store-status .exists { color: #666; }
.store-status .skipped { color: var(--accent); }

/* 参考出处横幅 */
.reference-banner { padding: 10px 12px; border: 1px solid #f0c040; border-radius: 4px; margin-bottom: 12px; background: #fffbf0; font-size: 13px; }
.reference-banner a { color: var(--accent); }

/* 通用 */
.empty-state { color: var(--muted); text-align: center; padding: 40px 20px; }
.loading { color: var(--muted); padding: 20px; text-align: center; }
.error-msg { background: #ffebee; color: var(--red); padding: 8px; border-radius: 4px; margin-bottom: 8px; }
.correction-box { background: #fff8e1; border-left: 3px solid #d4a017; padding: 8px; margin-top: 6px; font-size: 13px; }
.stale-badge { background: #ffd33d; color: #333; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

/* 加载中提示 */
.batch-loading { padding: 12px; border: 1px dashed var(--accent); border-radius: 4px; margin-bottom: 12px; color: var(--accent); font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <h1>事实查询</h1>
  <div class="config">
    <input type="text" id="cfg-url" placeholder="后端地址">
    <input type="text" id="cfg-key" placeholder="Worker Key">
    <button id="btn-save-cfg">保存</button>
    <button id="btn-test">测试</button>
    <button id="btn-clear-cache" title="改了后端功能后先点它清缓存，否则命中的是旧结果。">清缓存</button>
  </div>
</div>

<div class="main">
  <!-- 左栏 -->
  <div class="panel">
    <h2>待查文本</h2>
    <div class="text-input">
      <textarea id="input-text" placeholder="粘贴需要查询/验证的文本..."></textarea>
      <div class="mode-tabs">
        <label><input type="radio" name="mode" value="query" checked> 查询</label>
        <label><input type="radio" name="mode" value="verify"> 查证</label>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-check">查证</button>
        <button class="btn-secondary" id="btn-clear">清空</button>
      </div>
    </div>
    <div class="kb-entry-list">
      <h3>知识库 · 已入库词条
        <button class="btn-secondary" id="btn-refresh-kb" style="font-size:12px;padding:2px 8px;float:right;">刷新</button>
      </h3>
      <div style="display:flex;gap:4px;margin-bottom:8px;">
        <input type="text" id="kb-search-input" placeholder="搜索词条..." style="flex:1;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;">
        <button class="btn-secondary" id="btn-kb-search" style="font-size:12px;padding:4px 8px;">搜索</button>
      </div>
      <div id="kb-list"><div class="empty-state">点"刷新"加载</div></div>
    </div>
  </div>

  <!-- 中栏 -->
  <div class="panel">
    <h2>检索结果</h2>
    <div id="search-results"><div class="empty-state">查证后在此显示</div></div>
  </div>

  <!-- 右栏 -->
  <div class="panel">
    <h2>核查报告</h2>
    <div id="report-area"><div class="empty-state">查证后在此显示评级与纠错建议</div></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ==================== 状态 ====================
  var DEFAULT_API = 'https://factcheck.mymili.top';
  var state = {
    baseUrl: localStorage.getItem('fc_base_url') || DEFAULT_API,
    workerKey: localStorage.getItem('fc_worker_key') || '',
    mode: 'query',
    busy: false,
    // 查证模式的累计数据（分批续查合并用）
    verify: null,
  };

  var $ = function(id) { return document.getElementById(id); };

  // ==================== 工具 ====================
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Content-Type'] = 'application/json';
    if (state.workerKey) opts.headers['X-Worker-Key'] = state.workerKey;
    var resp = await fetch(state.baseUrl + path, opts);
    var j = await resp.json();
    if (!j.ok) throw new Error((j.error && j.error.message) || '未知错误');
    return j.data;
  }

  function isStale(dateStr) {
    if (!dateStr) return false;
    return (Date.now() - new Date(dateStr).getTime()) > 180 * 24 * 60 * 60 * 1000;
  }

  // 古文/诗词识别（与后端口径一致）
  function looksLikeAncient(s) {
    s = String(s || '');
    var dense   = (s.match(/之|乎|者|也|矣|焉|哉|兮|乃|夫/g) || []).length;
    var modernU = (s.match(/[0-9][0-9.,]*\s*(?:℃|℉|%|％|公斤|千克|千米|公里|厘米|毫米|吨|克|升|毫升|元|美元|亿|万|平方|摄氏|华氏|岁)/g) || []).length;
    var latin   = (s.match(/[A-Za-z]{2,}/g) || []).length;
    var modern  = modernU + latin;
    if (modern >= 2 && dense < 3) return false;
    var quoted   = /["\u201c][^"\u201d]{2,}["\u201d]/.test(s);
    var hasTitle = /《[^》]{2,40}》/.test(s);
    if (quoted || hasTitle) {
      var qLen = (s.match(/["\u201c][^"\u201d]{2,}["\u201d]/g) || []).join('').length;
      var prose = s.replace(/《[^》]{2,40}》/g, '')
                   .replace(/["\u201c][^"\u201d]{2,}["\u201d]/g, '')
                   .replace(/[（(][^）)]{0,24}[）)]/g, '')
                   .trim();
      if (dense < 3 && prose.length >= 24 && prose.length >= qLen * 0.66) return false;
      return true;
    }
    if ((modernU >= 1 || latin >= 1) && dense < 3) return false;
    if (/(之|乎|者|也|矣|焉|哉|兮|其|乃|夫|盖|是以|所谓)/.test(s) && /[，。；]/.test(s) && s.length < 200) return true;
    var clauses = s.split(/[，,。；;]/).filter(function(x) { return x.trim().length >= 4; });
    var short = clauses.filter(function(x) { return x.trim().length <= 12; }).length;
    return clauses.length >= 3 && short / clauses.length >= 0.6;
  }

  // ==================== 顶栏 ====================
  $('cfg-url').value = state.baseUrl;
  $('cfg-key').value = state.workerKey;

  $('btn-save-cfg').onclick = function() {
    state.baseUrl = $('cfg-url').value.trim().replace(/\/$/, '') || DEFAULT_API;
    state.workerKey = $('cfg-key').value.trim();
    localStorage.setItem('fc_base_url', state.baseUrl);
    localStorage.setItem('fc_worker_key', state.workerKey);
    alert('配置已保存');
  };

  $('btn-test').onclick = async function() {
    if (!state.baseUrl) { alert('请先填后端地址'); return; }
    $('btn-test').textContent = '测试中...';
    try {
      var resp = await fetch(state.baseUrl + '/api/health');
      var j = await resp.json();
      alert(j.ok ? '连通成功\n模型：' + j.data.llm : '连通失败');
    } catch (e) { alert('连接错误：' + e.message); }
    $('btn-test').textContent = '测试';
  };

  $('btn-clear-cache').onclick = async function() {
    if (!state.baseUrl) { alert('请先填后端地址'); return; }
    $('btn-clear-cache').textContent = '清除中...';
    try {
      var r = await apiFetch('/api/kb/submit', {
        method: 'POST',
        body: JSON.stringify({ action: 'clear_cache', type: 'all' })
      });
      var sc = r.searchCache || {}, kc = r.kbCache || {};
      if (sc.cooldown || kc.cooldown) {
        alert('无缓存可清除。\n\n刚清理过：KV 删除需约 1 分钟传播，期间重复点击看到的都是旧条目，已自动跳过。');
      } else {
        var total = (sc.cleared || 0) + (kc.cleared || 0);
        alert(total > 0
          ? '缓存已清除：' + total + ' 条'
          : '无缓存可清除（已是干净状态）。');
      }
    } catch (e) {
      alert('清缓存失败：' + e.message + '\n（需管理员密钥）');
    }
    $('btn-clear-cache').textContent = '清缓存';
  };

  // ==================== 模式切换 ====================
  document.querySelectorAll('input[name="mode"]').forEach(function(r) {
    r.onchange = function() { state.mode = r.value; };
  });

  // ==================== 检索结果渲染 ====================
  function renderResults(results) {
    var box = $('search-results');
    if (!results || results.length === 0) {
      box.innerHTML = '<div class="empty-state">无结果</div>';
      return;
    }
    box.innerHTML = results.map(function(r) {
      var tag = r.official_tag
        ? '<span class="tag-official">★官方</span>'
        : '<span class="tag-unofficial">待甄别</span>';
      var site = r.site_name ? '<span style="color:#0a7d32;font-size:12px;font-weight:600;">[' + escapeHtml(r.site_name) + ']</span>' : '';
      var snippet = (r.snippet || '').slice(0, 200);
      return '<div class="result-item">' +
        '<div class="title">' + tag + site +
        '<a href="' + escapeHtml(r.url || '#') + '" target="_blank">' + escapeHtml(r.title || '(无标题)') + ' ↗</a></div>' +
        '<div class="snippet">' + escapeHtml(snippet) + '</div></div>';
    }).join('');
  }

  // ==================== 核查报告渲染 ====================

  /** 整体可信度按比例：高≥70%→高，高+中≥40%→中，否则→低 */
  function calcOverallRating(ratings) {
    if (!ratings || ratings.length === 0) return { label: '未知', cls: 'rating-medium', high: 0, mid: 0, low: 0, total: 0, kbCount: 0 };
    var high = 0, mid = 0, low = 0, kbCount = 0;
    ratings.forEach(function(r) {
      if (r.rating === '高') high++;
      else if (r.rating === '中') mid++;
      else low++;
      if (r.fromKB) kbCount++;
    });
    var total = ratings.length;
    var highPct = high / total;
    var midPct = (high + mid) / total;
    var label, cls;
    if (highPct >= 0.7) { label = '高'; cls = 'rating-high'; }
    else if (midPct >= 0.4) { label = '中'; cls = 'rating-medium'; }
    else { label = '低'; cls = 'rating-low'; }
    return { label: label, cls: cls, high: high, mid: mid, low: low, total: total, kbCount: kbCount };
  }

  /** 单条断言的入库状态行（逐条独立控制） */
  function storeBadgeHtml(r) {
    var st = r.storeStatus;
    var title = r.storeTitle || '';
    if (st === 'auto') return '<div class="store-status"><span class="stored">✓ 已自动入知识库' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'kb') return '<div class="store-status"><span class="exists">▣ 知识库已有此事实，未重复入库' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'existing') return '<div class="store-status"><span class="exists">▣ 词条已收录相同事实，本次无新增' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'skipped') {
      // 评级高但未达自动入库门槛 → 每条独立的入库/不入库按钮
      var idx = r._idx || 0;
      return '<div class="store-status" id="store-row-' + idx + '">' +
        '<span class="skipped">☆ 可手动入库' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span>' +
        ' <button class="btn-store" onclick="window._storeSingle(' + idx + ')">入库</button>' +
        ' <button class="btn-store no" onclick="window._skipSingle(' + idx + ')">不入库</button>' +
        '</div>';
    }
    return '';
  }

  /** 渲染核查报告（查证模式） */
  function renderVerifyReport(data) {
    var box = $('report-area');
    var ratings = data.ratings || [];
    var overall = calcOverallRating(ratings);

    var html = '';

    // 顶部汇总
    html += '<div class="report-summary">' +
      '<span class="rating ' + overall.cls + '">真实度：' + overall.label + '</span>' +
      '<div class="stats">共核查 ' + overall.total + ' 个事实点：' +
      overall.high + ' 条属实、' + overall.mid + ' 条存疑、' + overall.low + ' 条查无实据/有误' +
      (overall.kbCount > 0 ? '（其中 ' + overall.kbCount + ' 条来自知识库）' : '') +
      '</div></div>';

    // 参考出处横幅
    var rm = data.referenceMatch;
    if (rm && rm.hit) {
      html += '<div class="reference-banner">' +
        '<strong>参考出处：</strong>整段文字在该站点上重现，但它不是权威课本/官方教育来源，仅供参考。<br>' +
        '<a href="' + escapeHtml(rm.url || '#') + '" target="_blank">' + escapeHtml(rm.title || rm.domain || '查看原文') + ' ↗</a>' +
        '　原文覆盖率 ' + Math.round((rm.coverage || 0) * 100) + '%' +
        '</div>';
    }

    // 整段命中横幅
    var wm = data.wholeMatch;
    if (wm && wm.hit) {
      html += '<div class="reference-banner" style="border-color:#28a745;background:#f0fff4;">' +
        '<strong style="color:#28a745;">✓ 整段原文命中：</strong>' + escapeHtml(wm.title || wm.domain || '') +
        '　覆盖率 ' + Math.round((wm.coverage || 0) * 100) + '%' +
        '　<a href="' + escapeHtml(wm.url || '#') + '" target="_blank">查看原文 ↗</a>' +
        '</div>';
    }

    // 逐条断言
    ratings.forEach(function(r, idx) {
      r._idx = idx;
      var c = r.claim || {};
      var ratingCls = r.rating === '高' ? 'rating-high' : (r.rating === '中' ? 'rating-medium' : 'rating-low');
      var srcLabel = r.fromKB ? '知识库' : (r.wholeMatch ? '整段直配' : '全网检索');

      html += '<div class="claim-item">' +
        '<span class="badge ' + ratingCls + '">' + escapeHtml(r.rating || '?') + '</span>' +
        '<span class="source-tag">来源：' + srcLabel + '</span>' +
        '<div class="claim-text">' + escapeHtml(c.claim || '') + '</div>';

      if (r.evidence) {
        html += '<div class="evidence"><strong>依据：</strong>' + escapeHtml(r.evidence.slice(0, 300)) + '</div>';
      }
      if (r.correction) {
        html += '<div class="correction-box"><strong>纠错建议：</strong>' + escapeHtml(r.correction) + '</div>';
      }
      // 来源链接
      if (r.sources && r.sources.length > 0) {
        html += '<div class="sources">';
        r.sources.slice(0, 4).forEach(function(s) {
          if (s.url) {
            html += '<a href="' + escapeHtml(s.url) + '" target="_blank">[' + escapeHtml((s.title || '').slice(0, 40)) + '] ↗</a>';
          }
        });
        html += '</div>';
      }
      // 入库状态（逐条独立）
      html += storeBadgeHtml(r);
      html += '</div>';
    });

    // 分批续查中提示
    if (data._loadingMore) {
      html += '<div class="batch-loading">剩余 ' + data._remaining + ' 条查询中……</div>';
    }

    box.innerHTML = html || '<div class="empty-state">无报告数据</div>';
  }

  /** 渲染查询模式报告 */
  function renderQueryReport(data) {
    var box = $('report-area');
    if (!data) { box.innerHTML = '<div class="empty-state">无报告</div>'; return; }

    // KB 命中
    if (data.kbHit) {
      var kbInfo = data.kbInfo || {};
      var html = '<div class="report-summary">' +
        '<span class="rating rating-high">知识库命中</span>' +
        '<div class="stats">' + escapeHtml(kbInfo.title || '') + ' · ' + (kbInfo.factCount || 0) + ' 条事实</div></div>';
      var missing = kbInfo.missingAttrs || [];
      if (missing.length > 0) {
        html += '<div class="reference-banner">知识库缺少以下属性的数据：' + missing.map(escapeHtml).join('、') + '。可单独查询这些属性触发全网检索补充。</div>';
      }
      (kbInfo.facts || []).forEach(function(f) {
        var src = f.source || {};
        html += '<div class="claim-item">' +
          '<span class="badge rating-high">' + escapeHtml(f.label || '') + '</span>' +
          '<div class="evidence">' + escapeHtml(f.value || '') + '</div>' +
          (src.url ? '<div class="sources"><a href="' + escapeHtml(src.url) + '" target="_blank">来源 ↗</a></div>' : '') +
          '</div>';
      });
      box.innerHTML = html;
      return;
    }

    // 全网检索
    var conf = data.confidence || '低';
    var confCls = conf === '高' ? 'rating-high' : (conf === '中' ? 'rating-medium' : 'rating-low');
    var html = '<div class="report-summary">' +
      '<span class="rating ' + confCls + '">可信度：' + escapeHtml(conf) + '</span></div>';

    if (data.answer) {
      html += '<div class="report-summary" style="background:#f0f7ff;border-color:#cfe3ff;">' +
        '<div style="font-size:15px;"><strong>直接解答：</strong>' + escapeHtml(data.answer) + '</div>' +
        (data.confidenceReason ? '<div style="font-size:12px;color:#888;margin-top:4px;">' + escapeHtml(data.confidenceReason) + '</div>' : '') +
        '</div>';
    }

    var fc = data.factCard || {};
    var facts = fc.facts || [];
    if (facts.length > 0) {
      html += '<div class="report-summary"><strong>' + escapeHtml(fc.title || '') + '</strong>（来源：维基百科等）';
      facts.forEach(function(f) {
        var src = f.source || {};
        html += '<div class="claim-item" style="margin-top:6px;">' +
          '<span class="badge rating-high">' + escapeHtml(f.property || '') + '</span>' +
          '<div class="evidence">' + escapeHtml(f.value || '') + '</div>' +
          (src.url ? '<div class="sources"><a href="' + escapeHtml(src.url) + '" target="_blank">来源 ↗</a></div>' : '') +
          '</div>';
      });
      html += '</div>';
    }

    // 入库提示
    if (data.draftCard) {
      if (data.autoStored) {
        html += '<div class="store-status"><span class="stored">★ 已自动入知识库（自动审核）：' + escapeHtml(data.draftCard.title || '') + '</span></div>';
      } else {
        html += '<div class="store-status"><span class="skipped">☆ 可信度 ' + escapeHtml(conf) + '，可手动入库：' + escapeHtml(data.draftCard.title || '') +
          ' <button class="btn-store" onclick="window._manualStore()">入库</button></div>';
      }
    }

    box.innerHTML = html || '<div class="empty-state">未检索到相关数据</div>';
  }

  // ==================== 逐条入库/不入库 ====================
  window._storeSingle = async function(idx) {
    var r = state.verify && state.verify.ratings && state.verify.ratings[idx];
    if (!r) return;
    var c = r.claim || {};
    var src = (r.sources || []).find(function(s) { return s.url; }) || {};
    // 诗句类断言：value 用断言原句
    var isQuote = c.metric === '原文' || c.quoteClaim;
    var fact = {
      key: 'fact_0',
      label: isQuote ? '原文' : (c.metric || '事实'),
      value: isQuote ? String(c.claim || '').trim() : (r.evidence || c.claim || ''),
      metric: c.metric || '',
      time: c.time || '',
      rating: 'high',
      source: {
        name: src.title || src.name || '',
        url: src.url || '',
        official_tag: !!src.official_tag,
        official_score: src.official_score || 0.5,
      },
      verified_at: new Date().toISOString().slice(0, 10),
    };
    var card = {
      title: (c.entity || '').trim() || String(c.claim || '').slice(0, 10),
      aliases: [],
      category: '人工',
      facts: [fact],
      references: (r.sources || []).slice(0, 5).map(function(s) {
        return { name: s.title || '', url: s.url || '', official_tag: !!s.official_tag, official_score: s.official_score || 0.5 };
      }),
    };
    try {
      await apiFetch('/api/kb/submit', {
        method: 'POST',
        body: JSON.stringify({ card: card, action: 'manual_store' })
      });
      r.storeStatus = 'auto'; // 更新为已入库
      renderVerifyReport(state.verify);
    } catch (e) { alert('入库失败：' + e.message); }
  };

  window._skipSingle = function(idx) {
    var r = state.verify && state.verify.ratings && state.verify.ratings[idx];
    if (!r) return;
    r.storeStatus = 'none'; // 不再显示按钮
    r._skippedByUser = true;
    renderVerifyReport(state.verify);
  };

  // 查询模式的手动入库（沿用 draftCard）
  window._manualStore = async function() {
    var lastCard = state._lastDraftCard;
    if (!lastCard) { alert('没有可入库的数据'); return; }
    try {
      await apiFetch('/api/kb/submit', {
        method: 'POST',
        body: JSON.stringify({ card: lastCard, action: 'manual_store' })
      });
      alert('入库成功');
    } catch (e) { alert('入库失败：' + e.message); }
  };

  // ==================== 查证流程 ====================

  $('btn-check').onclick = async function() {
    var text = $('input-text').value.trim();
    if (!text) { alert('请输入待查文本'); return; }
    if (!state.baseUrl) { alert('请先配置后端地址'); return; }
    if (state.busy) return;
    state.busy = true;
    $('btn-check').textContent = '查证中...';
    $('btn-check').disabled = true;
    $('search-results').innerHTML = '<div class="loading">检索中...</div>';
    $('report-area').innerHTML = '<div class="loading">核查中...</div>';

    try {
      if (looksLikeAncient(text)) {
        await runAncient(text);
      } else if (state.mode === 'verify') {
        await runVerify(text);
      } else {
        await runQuery(text);
      }
    } catch (e) {
      $('report-area').innerHTML = '<div class="error-msg">错误：' + escapeHtml(e.message) + '</div>';
    }
    state.busy = false;
    $('btn-check').textContent = '查证';
    $('btn-check').disabled = false;
  };

  /** 古文模式：调 verify-ancient + 前端整段事实核查合并 */
  async function runAncient(text) {
    var ad = await apiFetch('/api/verify-ancient', {
      method: 'POST',
      body: JSON.stringify({ text: text, category: 'auto' })
    });
    var sources = (ad.matches || []).map(function(m) {
      return { title: m.book || m.edition || '', url: m.url || '#', snippet: m.text || '', official_tag: m.edition === 'ctext' || m.edition === 'poetry-db' };
    });
    renderResults(sources);
    // 古文结果渲染
    var html = '<div class="report-summary"><span class="rating rating-high">古文查证</span></div>';
    html += '<div class="claim-item"><div class="claim-text"><strong>断句：</strong>' + escapeHtml(ad.segment || '') + '</div></div>';
    if (ad.suspected_err && ad.suspected_err.length > 0) {
      html += '<div class="correction-box"><strong>疑似讹字：</strong>' + escapeHtml(JSON.stringify(ad.suspected_err)) + '</div>';
    }
    (ad.matches || []).forEach(function(m) {
      var conf = m.confidence != null ? (m.confidence * 100).toFixed(0) + '%' : '?';
      html += '<div class="claim-item">' +
        '<div class="claim-text">' + escapeHtml(m.book || '') + (m.chapter ? ' · ' + escapeHtml(m.chapter) : '') + '</div>' +
        '<div class="evidence">' + escapeHtml((m.text || '').slice(0, 200)) + '</div>' +
        '<div class="stats" style="margin-top:4px;">相似度：' + conf + '</div>' +
        (m.url ? '<div class="sources"><a href="' + escapeHtml(m.url) + '" target="_blank">查看原文 ↗</a></div>' : '') +
        '</div>';
    });
    if (ad.all_low_confidence) {
      html += '<div class="correction-box">未找到精确匹配，疑似讹误/辑佚</div>';
    }
    // 合并现代事实核查
    try {
      var fc = await apiFetch('/api/check', {
        method: 'POST',
        body: JSON.stringify({ text: text, mode: 'verify' })
      });
      if (fc.ratings && fc.ratings.length > 0) {
        html += '<div class="report-summary" style="margin-top:12px;"><strong>现代事实核查</strong></div>';
        fc.ratings.forEach(function(r, idx) {
          r._idx = idx;
          var c = r.claim || {};
          var cls = r.rating === '高' ? 'rating-high' : (r.rating === '中' ? 'rating-medium' : 'rating-low');
          html += '<div class="claim-item">' +
            '<span class="badge ' + cls + '">' + escapeHtml(r.rating) + '</span>' +
            '<div class="claim-text">' + escapeHtml(c.claim || '') + '</div>' +
            (r.evidence ? '<div class="evidence">' + escapeHtml(r.evidence.slice(0, 200)) + '</div>' : '') +
            '</div>';
        });
      }
    } catch {}
    $('report-area').innerHTML = html;
  }

  /** 查证模式：自动分批续查 */
  async function runVerify(text) {
    state.verify = null;
    var offset = 0, guard = 0;
    var merged = null;

    do {
      var part = await apiFetch('/api/check', {
        method: 'POST',
        body: JSON.stringify({ text: text, mode: 'verify', claimOffset: offset })
      });
      if (!merged) {
        merged = part;
      } else {
        (merged.ratings = merged.ratings || []).push.apply(merged.ratings, part.ratings || []);
        (merged.searches = merged.searches || []).push.apply(merged.searches, part.searches || []);
        (merged.corrections = merged.corrections || []).push.apply(merged.corrections, part.corrections || []);
      }
      merged._loadingMore = false;
      state.verify = merged;

      // 先渲染已到的（流式）
      renderVerifyReport(merged);

      offset = part.nextClaimOffset;
      if (offset != null) {
        var done = (merged.ratings || []).length;
        var remain = Math.max(0, (part.totalClaims || done) - done);
        merged._loadingMore = true;
        merged._remaining = remain;
        renderVerifyReport(merged);
      }
      guard++;
    } while (offset != null && guard < 6);

    // 检索结果区：主检索 + 评级引用来源
    var seenUrl = {};
    var shown = [];
    var push = function(r) {
      if (r && r.url && !seenUrl[r.url]) { seenUrl[r.url] = 1; shown.push(r); }
    };
    (merged.searches || []).forEach(function(s) { (s.results || []).forEach(push); });
    (merged.ratings || []).forEach(function(rt) { (rt.sources || []).forEach(push); });
    renderResults(shown.slice(0, 15));
  }

  /** 查询模式 */
  async function runQuery(text) {
    var qd = await apiFetch('/api/check', {
      method: 'POST',
      body: JSON.stringify({ text: text, mode: 'query' })
    });
    if (qd.draftCard) state._lastDraftCard = qd.draftCard;
    var allResults = [];
    (qd.searches || []).forEach(function(s) { (s.results || []).forEach(function(r) { if (r.url) allResults.push(r); }); });
    renderResults(allResults.slice(0, 15));
    renderQueryReport(qd);
  }

  // ==================== 知识库管理 ====================
  async function loadKbList(keyword) {
    try {
      var r;
      if (keyword && keyword.trim()) {
        r = await apiFetch('/api/kb/submit', {
          method: 'POST',
          body: JSON.stringify({ action: 'search', keyword: keyword.trim() })
        });
      } else {
        r = await apiFetch('/api/kb/submit', {
          method: 'POST',
          body: JSON.stringify({ action: 'list_verified' })
        });
      }
      var items = r.items || [];
      var box = $('kb-list');
      if (!items.length) {
        box.innerHTML = '<div class="empty-state">' + (keyword ? '未搜到' : '知识库暂无词条') + '</div>';
        return;
      }
      box.innerHTML = items.map(function(it) {
        var st = it.status === 'auto_verified' ? '自动审核' : '人工审核';
        return '<div class="result-item" style="margin-bottom:6px;">' +
          '<div class="title">' + escapeHtml(it.title || '') +
          ' <span style="font-size:10px;color:#888;background:#e8f5e9;padding:1px 4px;border-radius:3px;">' + st + '</span>' +
          ' <span style="font-size:11px;color:#888;">' + (it.fact_count || 0) + '条</span>' +
          ' <button class="btn-secondary" style="font-size:11px;padding:1px 6px;" onclick="window._delKb(\'' + escapeHtml(it.id) + '\',\'' + escapeHtml(it.title || '') + '\')">删除</button>' +
          '</div></div>';
      }).join('');
    } catch (e) {
      $('kb-list').innerHTML = '<div class="error-msg">加载失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  window._delKb = async function(slug, title) {
    if (!confirm('确认删除词条"' + title + '"？\n此操作不可恢复。')) return;
    try {
      await apiFetch('/api/kb/submit', {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', slug: slug })
      });
      loadKbList('');
    } catch (e) { alert('删除失败：' + e.message); }
  };

  $('btn-refresh-kb').onclick = function() { loadKbList(''); };
  $('btn-kb-search').onclick = function() { loadKbList($('kb-search-input').value); };
  $('kb-search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadKbList(this.value);
  });

  // 清空
  $('btn-clear').onclick = function() {
    $('input-text').value = '';
    $('search-results').innerHTML = '<div class="empty-state">查证后在此显示结果</div>';
    $('report-area').innerHTML = '<div class="empty-state">查证后在此显示评级与纠错建议</div>';
    state.verify = null;
  };

  console.log('事实查询 已加载');
})();
</script>
