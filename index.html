<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>事实查询</title>
<style>
/* ==================== Design Tokens (DTCG) ==================== */
:root {
  /* Primitive palette — never use directly */
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
  --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
  --gray-800:#1f2937; --gray-900:#111827;
  --blue-50:#eff6ff; --blue-100:#dbeafe; --blue-500:#3b82f6; --blue-600:#2563eb;
  --blue-700:#1d4ed8;
  --green-50:#f0fdf4; --green-100:#dcfce7; --green-200:#bbf7d0; --green-300:#86efac;
  --green-600:#16a34a; --green-700:#15803d; --green-800:#166534;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-300:#fca5a5; --red-600:#dc2626;
  --red-700:#b91c1c; --red-800:#991b1b;
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-300:#fcd34d;
  --amber-600:#d97706; --amber-700:#b45309; --amber-800:#92400e;

  /* Semantic tokens */
  --bg: var(--gray-50);
  --panel: #fff;
  --border: var(--gray-200);
  --border-subtle: var(--gray-100);
  --text-primary: var(--gray-900);
  --text-secondary: var(--gray-600);
  --text-tertiary: var(--gray-400);
  --action: var(--blue-600);
  --action-hover: var(--blue-700);
  --success-bg: var(--green-50); --success-text: var(--green-800); --success-border: var(--green-200);
  --warning-bg: var(--amber-50); --warning-text: var(--amber-800); --warning-border: var(--amber-100);
  --error-bg: var(--red-50); --error-text: var(--red-800); --error-border: var(--red-100);

  /* Spacing (4px base) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;

  /* Typography */
  --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
}

* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text-primary);
  font-size:var(--fs-md); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ==================== Top Bar ==================== */
.topbar {
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:var(--sp-3) var(--sp-6); display:flex; align-items:center; gap:var(--sp-4);
  box-shadow:var(--shadow-sm); position:relative; z-index:10;
}
.topbar h1 { font-size:var(--fs-lg); font-weight:700; letter-spacing:-0.3px; color:var(--text-primary); }
.topbar .config { margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; }
.topbar input {
  padding:var(--sp-1) var(--sp-3); border:1px solid var(--gray-300); border-radius:var(--radius-sm);
  font-size:var(--fs-sm); width:180px; background:var(--gray-50); color:var(--text-primary);
  transition:border-color .15s,box-shadow .15s;
}
.topbar input:focus {
  outline:none; border-color:var(--action); box-shadow:0 0 0 3px var(--blue-50); background:#fff;
}
.topbar input::placeholder { color:var(--text-tertiary); }

/* ==================== Buttons ==================== */
.topbar button, .btn-secondary {
  padding:var(--sp-1) var(--sp-4); border:1px solid var(--gray-300); background:var(--panel);
  border-radius:var(--radius-sm); cursor:pointer; font-size:var(--fs-sm); font-weight:500;
  color:var(--text-primary); transition:all .15s; line-height:1.5;
}
.topbar button:hover, .btn-secondary:hover {
  background:var(--gray-50); border-color:var(--gray-400);
}
.topbar button:active, .btn-secondary:active { background:var(--gray-100); }
.topbar button:focus-visible, .btn-secondary:focus-visible {
  outline:2px solid var(--action); outline-offset:1px;
}
.btn-primary {
  padding:var(--sp-2) var(--sp-5); background:var(--action); color:#fff; border:none;
  border-radius:var(--radius-sm); cursor:pointer; font-size:var(--fs-base); font-weight:600;
  transition:background .15s,transform .1s;
}
.btn-primary:hover { background:var(--action-hover); }
.btn-primary:active { transform:scale(.98); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-primary:focus-visible { outline:2px solid var(--action); outline-offset:2px; }

/* ==================== Layout ==================== */
.main {
  display:grid; grid-template-columns:36% 28% 36%; gap:1px;
  background:var(--border); height:calc(100vh - 49px);
}
.panel {
  background:var(--panel); padding:var(--sp-4); overflow-y:auto;
  display:flex; flex-direction:column;
}
.panel h2 {
  font-size:var(--fs-sm); font-weight:600; color:var(--text-secondary);
  text-transform:uppercase; letter-spacing:.5px;
  margin-bottom:var(--sp-3); padding-bottom:var(--sp-2);
  border-bottom:1px solid var(--border-subtle);
}

/* ==================== Left Panel ==================== */
.text-input { flex:1; display:flex; flex-direction:column; min-height:0; }
.text-input textarea {
  flex:1; min-height:160px; padding:var(--sp-3); border:1px solid var(--gray-300);
  border-radius:var(--radius-md); font-family:inherit; font-size:var(--fs-md);
  resize:none; background:var(--gray-50); color:var(--text-primary);
  transition:border-color .15s,box-shadow .15s;
}
.text-input textarea:focus {
  outline:none; border-color:var(--action); box-shadow:0 0 0 3px var(--blue-50); background:#fff;
}
.text-input textarea::placeholder { color:var(--text-tertiary); }
.mode-tabs { display:flex; gap:var(--sp-4); margin:var(--sp-2) 0; }
.mode-tabs label {
  display:flex; align-items:center; gap:var(--sp-1); cursor:pointer;
  font-size:var(--fs-base); color:var(--text-secondary); font-weight:500;
  padding:var(--sp-1) var(--sp-2); border-radius:var(--radius-sm);
  transition:background .15s,color .15s;
}
.mode-tabs label:hover { background:var(--gray-100); color:var(--text-primary); }
.mode-tabs input[type="radio"] { accent-color:var(--action); }
.btn-row { display:flex; gap:var(--sp-2); margin-top:var(--sp-2); }

/* Knowledge base section */
.kb-entry-list {
  margin-top:var(--sp-5); border-top:1px solid var(--border-subtle); padding-top:var(--sp-3);
  max-height:280px; overflow:hidden; display:flex; flex-direction:column;
}
.kb-entry-list h3 {
  font-size:var(--fs-sm); color:var(--text-secondary); font-weight:600;
  margin-bottom:var(--sp-2); display:flex; align-items:center; justify-content:space-between;
}

/* ==================== Cards & Items ==================== */
.result-item {
  padding:var(--sp-3); border:1px solid var(--border-subtle); border-radius:var(--radius-md);
  margin-bottom:var(--sp-2); background:#fff; transition:border-color .15s,box-shadow .15s;
}
.result-item:hover { border-color:var(--gray-300); box-shadow:var(--shadow-sm); }
.result-item .title {
  font-weight:600; margin-bottom:var(--sp-1); display:flex; align-items:center;
  gap:var(--sp-2); flex-wrap:wrap; font-size:var(--fs-base);
}
.result-item .title a { color:var(--action); text-decoration:none; }
.result-item .title a:hover { text-decoration:underline; }
.result-item .snippet { color:var(--text-secondary); font-size:var(--fs-sm); margin-top:var(--sp-1); line-height:1.5; }

/* Tags */
.tag-official {
  background:var(--success-bg); color:var(--green-700); border:1px solid var(--success-border);
  font-size:var(--fs-xs); font-weight:600; padding:1px var(--sp-2); border-radius:99px;
}
.tag-unofficial {
  background:var(--gray-100); color:var(--gray-600); border:1px solid var(--gray-200);
  font-size:var(--fs-xs); font-weight:500; padding:1px var(--sp-2); border-radius:99px;
}

/* ==================== Report Summary ==================== */
.report-summary {
  padding:var(--sp-4); border:1px solid var(--border-subtle); border-radius:var(--radius-md);
  margin-bottom:var(--sp-3); background:var(--gray-50);
}
.report-summary .rating {
  display:inline-flex; align-items:center; padding:var(--sp-1) var(--sp-3);
  border-radius:var(--radius-sm); font-size:var(--fs-md); font-weight:700;
}
.rating-high { background:var(--success-bg); color:var(--green-700); border:1px solid var(--success-border); }
.rating-medium { background:var(--warning-bg); color:var(--amber-700); border:1px solid var(--warning-border); }
.rating-low { background:var(--error-bg); color:var(--red-700); border:1px solid var(--error-border); }
.report-summary .stats { font-size:var(--fs-sm); color:var(--text-secondary); margin-top:var(--sp-1); }

/* ==================== Claim Items ==================== */
.claim-item {
  border:1px solid var(--border-subtle); border-radius:var(--radius-md);
  padding:var(--sp-3); margin-bottom:var(--sp-3); background:#fff;
  transition:border-color .15s;
}
.claim-item:hover { border-color:var(--gray-300); }
.claim-item .badge {
  display:inline-flex; align-items:center; padding:2px var(--sp-2);
  border-radius:var(--radius-sm); font-size:var(--fs-sm); font-weight:700;
}
.claim-item .source-tag { font-size:var(--fs-xs); color:var(--text-tertiary); margin-left:var(--sp-2); }
.claim-item .claim-text { margin-top:var(--sp-1); font-weight:600; color:var(--text-primary); }
.claim-item .evidence { margin-top:var(--sp-1); color:var(--text-secondary); font-size:var(--fs-sm); line-height:1.6; }
.claim-item .sources {
  margin-top:var(--sp-2); padding-top:var(--sp-2); border-top:1px solid var(--border-subtle);
  font-size:var(--fs-sm);
}
.claim-item .sources a {
  color:var(--action); font-size:var(--fs-sm); text-decoration:none;
  display:inline-block; margin:2px var(--sp-2) 2px 0;
}
.claim-item .sources a:hover { text-decoration:underline; }

/* ==================== Store Status ==================== */
.store-status {
  margin-top:var(--sp-2); padding-top:var(--sp-2); border-top:1px solid var(--border-subtle);
  font-size:var(--fs-sm);
}
.store-status .btn-store {
  padding:3px var(--sp-3); font-size:var(--fs-sm); margin-left:var(--sp-2);
  border:1px solid var(--gray-300); border-radius:var(--radius-sm);
  background:var(--panel); cursor:pointer; font-weight:500;
  transition:all .15s;
}
.store-status .btn-store:hover { background:var(--gray-50); border-color:var(--gray-400); }
.store-status .stored { color:var(--green-700); font-weight:500; }
.store-status .exists { color:var(--gray-500); font-weight:500; }
.store-status .skipped { color:var(--action); font-weight:500; }

/* ==================== Reference Banner ==================== */
.reference-banner {
  padding:var(--sp-3) var(--sp-4); border:1px solid var(--warning-border);
  border-radius:var(--radius-md); margin-bottom:var(--sp-3);
  background:var(--warning-bg); font-size:var(--fs-sm); line-height:1.6;
}
.reference-banner a { color:var(--action); }

/* ==================== Misc ==================== */
.empty-state {
  color:var(--text-tertiary); text-align:center; padding:var(--sp-8) var(--sp-4);
  font-size:var(--fs-base);
}
.loading {
  color:var(--text-secondary); padding:var(--sp-5); text-align:center;
  font-size:var(--fs-base);
}
.error-msg {
  background:var(--error-bg); color:var(--red-700); padding:var(--sp-3);
  border-radius:var(--radius-md); border:1px solid var(--error-border);
  margin-bottom:var(--sp-2); font-size:var(--fs-sm); font-weight:500;
}
.correction-box {
  background:var(--warning-bg); border-left:3px solid var(--amber-600);
  padding:var(--sp-2) var(--sp-3); margin-top:var(--sp-2);
  font-size:var(--fs-sm); color:var(--amber-800);
}
.stale-badge {
  background:var(--amber-100); color:var(--amber-800); font-size:var(--fs-xs);
  padding:1px var(--sp-2); border-radius:99px; font-weight:500;
}
.batch-loading {
  padding:var(--sp-3); border:1px dashed var(--action); border-radius:var(--radius-md);
  margin-bottom:var(--sp-3); color:var(--action); font-size:var(--fs-sm);
  text-align:center; background:var(--blue-50);
}

/* KB entry items */
.kb-entry-item {
  padding:var(--sp-1) var(--sp-2); cursor:pointer; border-radius:var(--radius-sm);
  font-size:var(--fs-sm); color:var(--text-secondary);
  transition:background .15s;
}
.kb-entry-item:hover { background:var(--gray-100); color:var(--text-primary); }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--gray-300); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--gray-400); }

/* Responsive: no horizontal overflow */
@media (max-width:768px) {
  .main { grid-template-columns:1fr; height:auto; }
  .panel { max-height:50vh; }
  .topbar { flex-wrap:wrap; }
  .topbar input { width:140px; }
}

/* ==================== 知识库管理弹窗 ==================== */
.kb-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:999;
  display:flex; align-items:center; justify-content:center;
}
.kb-dialog {
  background:#fff; border-radius:var(--radius-lg); max-width:700px; width:90%; max-height:85vh;
  overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.kb-dialog .header {
  padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--sp-3);
}
.kb-dialog .header h3 { font-size:var(--fs-lg); font-weight:700; flex:1; }
.kb-dialog .tabs {
  display:flex; gap:0; border-bottom:1px solid var(--border); padding:0 var(--sp-2);
}
.kb-dialog .tab {
  padding:var(--sp-2) var(--sp-4); font-size:var(--fs-base); font-weight:500; color:var(--text-secondary);
  border-bottom:2px solid transparent; cursor:pointer; transition:all .15s;
}
.kb-dialog .tab:hover { color:var(--text-primary); background:var(--gray-50); }
.kb-dialog .tab.active { color:var(--action); border-bottom-color:var(--action); font-weight:600; }
.kb-dialog .tab .count { font-size:var(--fs-xs); color:var(--text-tertiary); margin-left:var(--sp-1); }
.kb-dialog .body { flex:1; overflow-y:auto; padding:var(--sp-4); }
.kb-dialog .footer {
  padding:var(--sp-3) var(--sp-5); border-top:1px solid var(--border); display:flex; gap:var(--sp-2); align-items:center;
}

/* 白名单管理 */
.wl-section { margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--border-subtle); }
.wl-section h4 { font-size:var(--fs-base); font-weight:600; margin-bottom:var(--sp-2); color:var(--text-primary); }
.wl-item {
  display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-3);
  border:1px solid var(--border-subtle); border-radius:var(--radius-sm); margin-bottom:var(--sp-1);
  font-size:var(--fs-sm); background:var(--gray-50);
}
.wl-item .domain { flex:1; color:var(--text-primary); font-weight:500; }
.wl-item button { padding:2px var(--sp-2); font-size:var(--fs-xs); border:1px solid var(--gray-300); border-radius:var(--radius-sm); background:#fff; cursor:pointer; color:var(--red-700); }
.wl-item button:hover { background:var(--error-bg); }
.wl-add-row { display:flex; gap:var(--sp-2); margin-top:var(--sp-2); }
.wl-add-row input { flex:1; padding:var(--sp-1) var(--sp-3); border:1px solid var(--gray-300); border-radius:var(--radius-sm); font-size:var(--fs-sm); }
</style>
</head>
<body>

<div class="topbar">
  <h1>事实查询</h1>
  <div class="config">
    <button class="btn-secondary" id="btn-open-kb" style="font-weight:600;">知识库</button>
    <input type="text" id="cfg-url" placeholder="后端地址">
    <input type="text" id="cfg-key" placeholder="Worker Key">
    <button id="btn-save-cfg">保存</button>
    <button id="btn-test">测试</button>
    <button id="btn-clear-cache" title="改了后端功能后先点它清缓存，否则命中的是旧结果。">清缓存</button>
  </div>
</div>

<div class="main">
  <!-- 左栏 -->
  <div class="panel">
    <h2>待查文本</h2>
    <div class="text-input">
      <textarea id="input-text" placeholder="粘贴需要查询/验证的文本..."></textarea>
      <div class="mode-tabs">
        <label><input type="radio" name="mode" value="query" checked> 查询</label>
        <label><input type="radio" name="mode" value="verify"> 查证</label>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-check">查证</button>
        <button class="btn-secondary" id="btn-clear">清空</button>
      </div>
    </div>
  </div>

  <!-- 中栏 -->
  <div class="panel">
    <h2>检索结果</h2>
    <div id="search-results"><div class="empty-state">查证后在此显示</div></div>
  </div>

  <!-- 右栏 -->
  <div class="panel">
    <h2>核查报告</h2>
    <div id="report-area"><div class="empty-state">查证后在此显示评级与纠错建议</div></div>
  </div>
</div>

<!-- 知识库管理弹窗 -->
<div class="kb-overlay" id="kb-overlay" style="display:none;">
  <div class="kb-dialog">
    <div class="header">
      <h3>知识库管理</h3>
      <button class="btn-secondary" id="btn-kb-refresh">刷新</button>
      <button class="btn-secondary" id="btn-kb-close">关闭</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="auto">自动审核 <span class="count" id="kb-count-auto"></span></div>
      <div class="tab" data-tab="manual">人工审核 <span class="count" id="kb-count-manual"></span></div>
      <div class="tab" data-tab="whitelist">网站白名单 <span class="count" id="kb-count-wl"></span></div>
    </div>
    <div class="body" id="kb-dialog-body">
      <!-- 动态渲染 -->
    </div>
    <div class="footer">
      <input type="text" id="kb-search-input" placeholder="搜索词条标题..." style="flex:1;padding:4px 8px;border:1px solid var(--gray-300);border-radius:4px;font-size:13px;">
      <button class="btn-secondary" id="btn-kb-search">搜索</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ==================== 状态 ====================
  var DEFAULT_API = 'https://factcheck.mymili.top';
  var state = {
    baseUrl: localStorage.getItem('fc_base_url') || DEFAULT_API,
    workerKey: localStorage.getItem('fc_worker_key') || '',
    mode: 'query',
    busy: false,
    // 查证模式的累计数据（分批续查合并用）
    verify: null,
  };

  var $ = function(id) { return document.getElementById(id); };

  // ==================== 工具 ====================

  /** 判断是否为国内无法直接访问的站点，返回镜像链接（如有） */
  function mirrorLink(url) {
    if (!url) return null;
    // 维基百科 → Wikiwand 镜像（国内可访问）
    var m = url.match(/^https?:\/\/([a-z]+)\.wikipedia\.org\/wiki\/(.+)$/);
    if (m) return 'https://www.wikiwand.com/' + m[1] + '/articles/' + m[2];
    // 维基文库 → 无稳定镜像，标注即可
    if (/wikisource\.org/.test(url)) return 'BLOCKED';
    return null;
  }

  /** 生成来源链接 HTML（国外站自动附镜像/提示） */
  function sourceLinkHtml(url, title) {
    if (!url) return '';
    var mirror = mirrorLink(url);
    var html = '<a href="' + escapeHtml(url) + '" target="_blank" style="color:#0366d6;text-decoration:underline;">' + escapeHtml(title || '查看原文') + ' ↗</a>';
    if (mirror === 'BLOCKED') {
      html += ' <span style="font-size:11px;color:#d73a49;" title="该站点在国内网络环境下可能无法直接访问">⚠ 需科学上网</span>';
    } else if (mirror) {
      html += ' <a href="' + escapeHtml(mirror) + '" target="_blank" style="font-size:11px;color:#28a745;text-decoration:underline;" title="国内可访问的镜像站点">镜像 ↗</a>';
    }
    return html;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Content-Type'] = 'application/json';
    if (state.workerKey) opts.headers['X-Worker-Key'] = state.workerKey;
    var resp = await fetch(state.baseUrl + path, opts);
    var j = await resp.json();
    if (!j.ok) throw new Error((j.error && j.error.message) || '未知错误');
    return j.data;
  }

  function isStale(dateStr) {
    if (!dateStr) return false;
    return (Date.now() - new Date(dateStr).getTime()) > 180 * 24 * 60 * 60 * 1000;

  // 古文/诗词识别（与后端口径一致）
  function looksLikeAncient(s) {
    s = String(s || '');
    var dense   = (s.match(/之|乎|者|也|矣|焉|哉|兮|乃|夫/g) || []).length;
    var modernU = (s.match(/[0-9][0-9.,]*\s*(?:℃|℉|%|％|公斤|千克|千米|公里|厘米|毫米|吨|克|升|毫升|元|美元|亿|万|平方|摄氏|华氏|岁)/g) || []).length;
    var latin   = (s.match(/[A-Za-z]{2,}/g) || []).length;
    var modern  = modernU + latin;
    if (modern >= 2 && dense < 3) return false;
    var quoted   = /["\u201c][^"\u201d]{2,}["\u201d]/.test(s);
    var hasTitle = /《[^》]{2,40}》/.test(s);
    if (quoted || hasTitle) {
      var qLen = (s.match(/["\u201c][^"\u201d]{2,}["\u201d]/g) || []).join('').length;
      var prose = s.replace(/《[^》]{2,40}》/g, '')
                   .replace(/["\u201c][^"\u201d]{2,}["\u201d]/g, '')
                   .replace(/[（(][^）)]{0,24}[）)]/g, '')
                   .trim();
      if (dense < 3 && prose.length >= 24 && prose.length >= qLen * 0.66) return false;
      return true;
    }
    if ((modernU >= 1 || latin >= 1) && dense < 3) return false;
    if (/(之|乎|者|也|矣|焉|哉|兮|其|乃|夫|盖|是以|所谓)/.test(s) && /[，。；]/.test(s) && s.length < 200) return true;
    var clauses = s.split(/[，,。；;]/).filter(function(x) { return x.trim().length >= 4; });
    var short = clauses.filter(function(x) { return x.trim().length <= 12; }).length;
    return clauses.length >= 3 && short / clauses.length >= 0.6;
  }

  /** 整体可信度按比例：高≥70%→高，高+中≥40%→中，否则→低 */
  function calcOverallRating(ratings) {
    if (!ratings || ratings.length === 0) return { label: '未知', cls: 'rating-medium', high: 0, mid: 0, low: 0, total: 0, kbCount: 0 };
    var high = 0, mid = 0, low = 0, kbCount = 0;
    ratings.forEach(function(r) {
      if (r.rating === '高') high++;
      else if (r.rating === '中') mid++;
      else low++;
      if (r.fromKB) kbCount++;
    });
    var total = ratings.length;
    var highPct = high / total;
    var midPct = (high + mid) / total;
    var label, cls;
    if (highPct >= 0.7) { label = '高'; cls = 'rating-high'; }
    else if (midPct >= 0.4) { label = '中'; cls = 'rating-medium'; }
    else { label = '低'; cls = 'rating-low'; }
    return { label: label, cls: cls, high: high, mid: mid, low: low, total: total, kbCount: kbCount };
  }

  /** 单条断言的入库状态行（逐条独立控制） */
  function storeBadgeHtml(r) {
    var st = r.storeStatus;
    var title = r.storeTitle || '';
    if (st === 'auto') return '<div class="store-status"><span class="stored">✓ 已自动入知识库' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'kb') return '<div class="store-status"><span class="exists">▣ 知识库已有此事实，未重复入库' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'existing') return '<div class="store-status"><span class="exists">▣ 词条已收录相同事实，本次无新增' + (title ? '（' + escapeHtml(title) + '）' : '') + '</span></div>';
    if (st === 'skipped') {
      // 评级高但未达自动入库门槛 → 每条独立的入库/不入库按钮
      var idx = r._idx != null ? r._idx : 0;
      return '<div class="store-status" style="background:#f8f9fa;padding:8px;border-radius:4px;margin-top:6px;">' +
        '<span class="skipped" style="font-weight:600;">☆ 可手动入库</span>' +
        (title ? ' <span style="color:#6a737d;font-size:12px;">词条：' + escapeHtml(title) + '</span>' : '') +
        '<br>' +
        '<button class="btn-store" style="margin-top:4px;padding:4px 16px;font-size:13px;background:#0366d6;color:#fff;border:none;border-radius:4px;cursor:pointer;" onclick="window._storeSingle(' + idx + ')">入库</button>' +
        ' <button class="btn-store" style="margin-top:4px;padding:4px 16px;font-size:13px;background:#fff;color:#666;border:1px solid #ddd;border-radius:4px;cursor:pointer;" onclick="window._skipSingle(' + idx + ')">不入库</button>' +
        '</div>';
    }
    // 评级非高但有来源 → 也允许手动入库（用户逐条判断）
    if (st === 'none' && r.rating === '中' && r.sources && r.sources.length > 0 && !r._skippedByUser) {
      var idx2 = r._idx != null ? r._idx : 0;
      return '<div class="store-status" style="background:#fff8e1;padding:6px;border-radius:4px;margin-top:4px;font-size:12px;">' +
        '<span style="color:#b8860b;">评级中，可考虑手动入库</span>' +
        ' <button class="btn-store" style="padding:2px 10px;font-size:11px;border:1px solid #ddd;border-radius:3px;background:#fff;cursor:pointer;" onclick="window._storeSingle(' + idx2 + ')">入库</button>' +
        ' <button class="btn-store" style="padding:2px 10px;font-size:11px;border:1px solid #ddd;border-radius:3px;background:#fff;color:#999;cursor:pointer;" onclick="window._skipSingle(' + idx2 + ')">跳过</button>' +
        '</div>';
    }
    return '';
  }

  /** 渲染核查报告（查证模式） */
  function renderVerifyReport(data) {
    var box = $('report-area');
    var ratings = data.ratings || [];
    var overall = calcOverallRating(ratings);

    var html = '';

    // 顶部汇总
    html += '<div class="report-summary">' +
      '<span class="rating ' + overall.cls + '">真实度：' + overall.label + '</span>' +
      '<div class="stats">共核查 ' + overall.total + ' 个事实点：' +
      overall.high + ' 条属实、' + overall.mid + ' 条存疑、' + overall.low + ' 条查无实据/有误' +
      (overall.kbCount > 0 ? '（其中 ' + overall.kbCount + ' 条来自知识库）' : '') +
      '</div></div>';

    // 参考出处横幅
    var rm = data.referenceMatch;
    if (rm && rm.hit) {
      html += '<div class="reference-banner">' +
        '<strong>参考出处：</strong>整段文字在该站点上重现，但它不是权威课本/官方教育来源，仅供参考。<br>' +
        '<a href="' + escapeHtml(rm.url || '#') + '" target="_blank">' + escapeHtml(rm.title || rm.domain || '查看原文') + ' ↗</a>' +
        '　原文覆盖率 ' + Math.round((rm.coverage || 0) * 100) + '%' +
        '</div>';
    }

    // 整段命中横幅
    var wm = data.wholeMatch;
    if (wm && wm.hit) {
      html += '<div class="reference-banner" style="border-color:#28a745;background:#f0fff4;">' +
        '<strong style="color:#28a745;">✓ 整段原文命中：</strong>' + escapeHtml(wm.title || wm.domain || '') +
        '　覆盖率 ' + Math.round((wm.coverage || 0) * 100) + '%' +
        '　<a href="' + escapeHtml(wm.url || '#') + '" target="_blank">查看原文 ↗</a>' +
        '</div>';
    }

    // 逐条断言
    ratings.forEach(function(r, idx) {
      r._idx = idx;
      var c = r.claim || {};
      var ratingCls = r.rating === '高' ? 'rating-high' : (r.rating === '中' ? 'rating-medium' : 'rating-low');
      var srcLabel = r.fromKB ? '知识库' : (r.wholeMatch ? '整段直配' : '全网检索');

      html += '<div class="claim-item">' +
        '<span class="badge ' + ratingCls + '">' + escapeHtml(r.rating || '?') + '</span>' +
        '<span class="source-tag">来源：' + srcLabel + '</span>' +
        '<div class="claim-text">' + escapeHtml(c.claim || '') + '</div>';

      if (r.evidence) {
        html += '<div class="evidence"><strong>依据：</strong>' + escapeHtml(r.evidence.slice(0, 300)) + '</div>';
      }
      if (r.correction) {
        html += '<div class="correction-box"><strong>纠错建议：</strong>' + escapeHtml(r.correction) + '</div>';
      }
      // 来源链接（独立一行，清晰可点击；国外站自动附镜像）
      if (r.sources && r.sources.length > 0) {
        html += '<div class="sources" style="margin-top:8px;padding-top:6px;border-top:1px dashed #e1e4e8;font-size:12px;">';
        html += '<span style="color:#6a737d;">证据来源：</span> ';
        r.sources.slice(0, 4).forEach(function(s, si) {
          if (s.url) {
            html += '<span style="display:inline-block;margin:2px 8px 2px 0;">' + (si + 1) + '. ' + sourceLinkHtml(s.url, (s.title || '查看原文').slice(0, 35)) + '</span>';
          }
        });
        html += '</div>';
      }
      // 入库状态（逐条独立）
      html += storeBadgeHtml(r);
      html += '</div>';
    });

    // 分批续查中提示
    if (data._loadingMore) {
      html += '<div class="batch-loading">剩余 ' + data._remaining + ' 条查询中……</div>';
    }

    box.innerHTML = html || '<div class="empty-state">无报告数据</div>';
  }

  /** 渲染查询模式报告 */
  function renderQueryReport(data) {
    var box = $('report-area');
    if (!data) { box.innerHTML = '<div class="empty-state">无报告</div>'; return; }

    // KB 命中
    if (data.kbHit) {
      var kbInfo = data.kbInfo || {};

      var missing = kbInfo.missingAttrs || [];
      if (missing.length > 0) {
        html += '<div class="reference-banner">知识库缺少以下属性的数据：' + missing.map(escapeHtml).join('、') + '。可单独查询这些属性触发全网检索补充。</div>';
      }

        html += '<div class="claim-item">' +

          '</div>';

    }

    // 全网检索

    var confCls = conf === '高' ? 'rating-high' : (conf === '中' ? 'rating-medium' : 'rating-low');
    var html = '<div class="report-summary">' +
      '<span class="rating ' + confCls + '">可信度：' + escapeHtml(conf) + '</span></div>';

          '</div>';
      });
      html += '</div>';
    }

    // 入库提示
    if (data.draftCard) {
      if (data.autoStored) {
        html += '<div class="store-status"><span class="stored">★ 已自动入知识库（自动审核）：' + escapeHtml(data.draftCard.title || '') + '</span></div>';
      } else {
        html += '<div class="store-status"><span class="skipped">☆ 可信度 ' + escapeHtml(conf) + '，可手动入库：' + escapeHtml(data.draftCard.title || '') +
          ' <button class="btn-store" onclick="window._manualStore()">入库</button></div>';
      }
    }

    box.innerHTML = html || '<div class="empty-state">未检索到相关数据</div>';
  }

  // ==================== 逐条入库/不入库 ====================
  window._storeSingle = async function(idx) {
    var r = state.verify && state.verify.ratings && state.verify.ratings[idx];
    if (!r) return;
    var c = r.claim || {};
    var src = (r.sources || []).find(function(s) { return s.url; }) || {};
    // 诗句类断言：value 用断言原句
    var isQuote = c.metric === '原文' || c.quoteClaim;
    var fact = {
      key: 'fact_0',
      label: isQuote ? '原文' : (c.metric || '事实'),
      value: isQuote ? String(c.claim || '').trim() : (r.evidence || c.claim || ''),
      metric: c.metric || '',
      time: c.time || '',
      rating: 'high',
      source: {
        name: src.title || src.name || '',
        url: src.url || '',
        official_tag: !!src.official_tag,
        official_score: src.official_score || 0.5,
      },
      verified_at: new Date().toISOString().slice(0, 10),
    };
    var card = {
      title: (c.entity || '').trim() || String(c.claim || '').slice(0, 10),
      aliases: [],
      category: '人工',
      facts: [fact],
      references: (r.sources || []).slice(0, 5).map(function(s) {
        return { name: s.title || '', url: s.url || '', official_tag: !!s.official_tag, official_score: s.official_score || 0.5 };
      }),
    };
    try {
      await apiFetch('/api/kb/submit', {
        method: 'POST',
        body: JSON.stringify({ card: card, action: 'manual_store' })
      });
      r.storeStatus = 'auto'; // 更新为已入库
      renderVerifyReport(state.verify);
    } catch (e) { alert('入库失败：' + e.message); }
  };

  window._skipSingle = function(idx) {
    var r = state.verify && state.verify.ratings && state.verify.ratings[idx];
    if (!r) return;
    r.storeStatus = 'none'; // 不再显示按钮
    r._skippedByUser = true;
    renderVerifyReport(state.verify);
  };

  /** 古文模式：调 verify-ancient + 前端整段事实核查合并 */
  async function runAncient(text) {
    var ad = await apiFetch('/api/verify-ancient', {
      method: 'POST',
      body: JSON.stringify({ text: text, category: 'auto' })
    });
    var sources = (ad.matches || []).map(function(m) {
      return { title: m.book || m.edition || '', url: m.url || '#', snippet: m.text || '', official_tag: m.edition === 'ctext' || m.edition === 'poetry-db' };
    });
    renderResults(sources);
    // 古文结果渲染
    var html = '<div class="report-summary"><span class="rating rating-high">古文查证</span></div>';
    html += '<div class="claim-item"><div class="claim-text"><strong>断句：</strong>' + escapeHtml(ad.segment || '') + '</div></div>';
    if (ad.suspected_err && ad.suspected_err.length > 0) {
      html += '<div class="correction-box"><strong>疑似讹字：</strong>' + escapeHtml(JSON.stringify(ad.suspected_err)) + '</div>';
    }
    (ad.matches || []).forEach(function(m) {
      var conf = m.confidence != null ? (m.confidence * 100).toFixed(0) + '%' : '?';
      html += '<div class="claim-item">' +
        '<div class="claim-text">' + escapeHtml(m.book || '') + (m.chapter ? ' · ' + escapeHtml(m.chapter) : '') + '</div>' +
        '<div class="evidence">' + escapeHtml((m.text || '').slice(0, 200)) + '</div>' +
        '<div class="stats" style="margin-top:4px;">相似度：' + conf + '</div>' +
        (m.url ? '<div class="sources"><a href="' + escapeHtml(m.url) + '" target="_blank">查看原文 ↗</a></div>' : '') +
        '</div>';
    });
    if (ad.all_low_confidence) {
      html += '<div class="correction-box">未找到精确匹配，疑似讹误/辑佚</div>';
    }
    // 合并现代事实核查
    try {
      var fc = await apiFetch('/api/check', {
        method: 'POST',
        body: JSON.stringify({ text: text, mode: 'verify' })
      });
      if (fc.ratings && fc.ratings.length > 0) {
        html += '<div class="report-summary" style="margin-top:12px;"><strong>现代事实核查</strong></div>';
        fc.ratings.forEach(function(r, idx) {
          r._idx = idx;
          var c = r.claim || {};
          var cls = r.rating === '高' ? 'rating-high' : (r.rating === '中' ? 'rating-medium' : 'rating-low');
          html += '<div class="claim-item">' +
            '<span class="badge ' + cls + '">' + escapeHtml(r.rating) + '</span>' +
            '<div class="claim-text">' + escapeHtml(c.claim || '') + '</div>' +
            (r.evidence ? '<div class="evidence">' + escapeHtml(r.evidence.slice(0, 200)) + '</div>' : '') +
            '</div>';
        });
      }
    } catch {}
    $('report-area').innerHTML = html;
  }

  /** 查证模式：自动分批续查 */
  async function runVerify(text) {
    state.verify = null;
    var offset = 0, guard = 0;
    var merged = null;

    do {
      var part = await apiFetch('/api/check', {
        method: 'POST',
        body: JSON.stringify({ text: text, mode: 'verify', claimOffset: offset })
      });
      if (!merged) {
        merged = part;
      } else {
        (merged.ratings = merged.ratings || []).push.apply(merged.ratings, part.ratings || []);
        (merged.searches = merged.searches || []).push.apply(merged.searches, part.searches || []);
        (merged.corrections = merged.corrections || []).push.apply(merged.corrections, part.corrections || []);
      }
      merged._loadingMore = false;
      state.verify = merged;

      // 先渲染已到的（流式）
      renderVerifyReport(merged);

      offset = part.nextClaimOffset;
      if (offset != null) {
        var done = (merged.ratings || []).length;
        var remain = Math.max(0, (part.totalClaims || done) - done);
        merged._loadingMore = true;
        merged._remaining = remain;
        renderVerifyReport(merged);
      }
      guard++;
    } while (offset != null && guard < 6);

    // 检索结果区：主检索 + 评级引用来源
    var seenUrl = {};
    var shown = [];
    var push = function(r) {
      if (r && r.url && !seenUrl[r.url]) { seenUrl[r.url] = 1; shown.push(r); }
    };
    (merged.searches || []).forEach(function(s) { (s.results || []).forEach(push); });
    (merged.ratings || []).forEach(function(rt) { (rt.sources || []).forEach(push); });
    renderResults(shown.slice(0, 15));
  }

  /** 查询模式 */
  async function runQuery(text) {
    var qd = await apiFetch('/api/check', {
      method: 'POST',
      body: JSON.stringify({ text: text, mode: 'query' })
    });
    if (qd.draftCard) state._lastDraftCard = qd.draftCard;
    var allResults = [];
    (qd.searches || []).forEach(function(s) { (s.results || []).forEach(function(r) { if (r.url) allResults.push(r); }); });
    renderResults(allResults.slice(0, 15));
    renderQueryReport(qd);
  }

  // ==================== 知识库管理弹窗 ====================
  var kbTab = 'auto';
  var kbItems = [];

  $('btn-open-kb').onclick = function() {
    $('kb-overlay').style.display = 'flex';
    kbLoadTab();
  };
  $('btn-kb-close').onclick = function() { $('kb-overlay').style.display = 'none'; };
  $('kb-overlay').onclick = function(e) { if (e.target === this) this.style.display = 'none'; };
  $('btn-kb-refresh').onclick = function() { kbLoadTab(); };
  $('btn-kb-search').onclick = function() { kbLoadTab($('kb-search-input').value); };
  $('kb-search-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') kbLoadTab(this.value); });

  document.querySelectorAll('.kb-dialog .tab').forEach(function(tab) {
    tab.onclick = function() {
      document.querySelectorAll('.kb-dialog .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      kbTab = tab.dataset.tab;
      kbRenderBody();
    };
  });

  async function kbLoadTab(keyword) {
    var body = $('kb-dialog-body');
    body.innerHTML = '<div class="loading">加载中...</div>';
    try {
      if (kbTab === 'whitelist') {
        kbRenderWhitelist();
        return;
      }
      var r;
      if (keyword && keyword.trim()) {
        r = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'search', keyword: keyword.trim() }) });
      } else {
        r = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'list_verified' }) });
      }
      kbItems = r.items || [];
      kbRenderBody();
    } catch (e) {
      body.innerHTML = '<div class="error-msg">加载失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  function kbRenderBody() {
    var body = $('kb-dialog-body');
    if (kbTab === 'whitelist') { kbRenderWhitelist(); return; }
    var statusKey = kbTab === 'auto' ? 'auto_verified' : 'verified';
    var filtered = kbItems.filter(function(it) { return it.status === statusKey; });
    var otherCount = kbItems.length - filtered.length;

    $('kb-count-auto').textContent = '(' + kbItems.filter(function(i){return i.status==='auto_verified'}).length + ')';
    $('kb-count-manual').textContent = '(' + kbItems.filter(function(i){return i.status==='verified'}).length + ')';

    if (!filtered.length) {
      body.innerHTML = '<div class="empty-state">' + (kbTab === 'auto' ? '暂无自动审核词条' : '暂无人工审核词条') + '</div>';
      return;
    }
    body.innerHTML = filtered.map(function(it) {
      return '<div class="result-item" style="margin-bottom:6px;">' +
        '<div class="title">' + escapeHtml(it.title || '') +
        ' <span style="font-size:11px;color:#888;">' + (it.fact_count || 0) + '条事实</span>' +
        ' <span style="font-size:10px;color:#888;">v' + (it.version || 1) + '</span>' +
        ' <button class="btn-secondary" style="font-size:11px;padding:1px 8px;margin-left:4px;" onclick="window._viewKb(\'' + escapeHtml(it.id) + '\')">查看</button>' +
        ' <button class="btn-secondary" style="font-size:11px;padding:1px 8px;color:#dc2626;" onclick="window._delKb(\'' + escapeHtml(it.id) + '\',\'' + escapeHtml(it.title || '') + '\')">删除</button>' +
        '</div></div>';
    }).join('');
  }

  async function kbRenderWhitelist() {
    var body = $('kb-dialog-body');
    body.innerHTML = '<div class="loading">加载白名单...</div>';
    try {
      var r = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'get_whitelist' }) });
      var whitelist = r.whitelist || [];
      state.whitelist = whitelist;
      $('kb-count-wl').textContent = '(' + whitelist.length + ')';

      var html = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">' +
        '白名单中的网站在查询结果中与官方网站并列显示为权威来源</div>';

      html += '<div class="wl-add-row">' +
        '<input type="text" id="wl-add-input" placeholder="输入域名，如：example.com" style="flex:1;padding:6px 10px;border:1px solid var(--gray-300);border-radius:4px;font-size:13px;">' +
        '<button class="btn-primary" style="padding:6px 16px;font-size:13px;" onclick="window._wlAdd()">添加</button></div>';

      if (!whitelist.length) {
        html += '<div class="empty-state" style="padding:20px;">暂无白名单网站</div>';
      } else {
        html += '<div style="margin-top:12px;">' + whitelist.map(function(domain) {
          return '<div class="wl-item"><span class="domain">' + escapeHtml(domain) + '</span>' +
            '<button onclick="window._wlDel(\'' + escapeHtml(domain) + '\')">移除</button></div>';
        }).join('') + '</div>';
      }
      body.innerHTML = html;

      $('wl-add-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') window._wlAdd();
      });
    } catch (e) {
      body.innerHTML = '<div class="error-msg">加载失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  window._wlAdd = async function() {
    var domain = $('wl-add-input').value.trim();
    if (!domain) return;
    try {
      var r = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'add_whitelist', domain }) });
      if (r.duplicated) { alert('该域名已在白名单中'); return; }
      kbRenderWhitelist();
    } catch (e) { alert('添加失败：' + e.message); }
  };

  window._wlDel = async function(domain) {
    try {
      await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'remove_whitelist', domain }) });
      kbRenderWhitelist();
    } catch (e) { alert('移除失败：' + e.message); }
  };

  // 词条详情弹窗（可选中复制）
  window._viewKb = async function(slug) {
    try {
      var r = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'get', slug: slug }) });
      var card = r.card;
      if (!card) { alert('词条不存在'); return; }
      var factsHtml = (card.facts || []).map(function(f) {
        var src = f.source || {};
        var srcLink = src.url ? ' <a href="' + escapeHtml(src.url) + '" target="_blank" style="color:#0366d6;font-size:12px;text-decoration:underline;">' + escapeHtml(src.name || '来源') + ' ↗</a>' : '';
        return '<div style="padding:6px 0;border-bottom:1px dashed #e1e4e8;">' +
          '<span style="font-weight:600;color:#0366d6;">' + escapeHtml(f.label || '') + '</span>' +
          '<span style="color:#888;font-size:11px;margin-left:4px;">[' + escapeHtml(f.rating || '?') + ']</span>' +
          '<div style="margin:2px 0;user-select:text;-webkit-user-select:text;cursor:text;">' + escapeHtml(f.value || '') + '</div>' +
          '<div style="font-size:12px;color:#888;">' + escapeHtml(src.name || '') + srcLink + '</div></div>';
      }).join('');
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;';
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      var dialog = document.createElement('div');
      dialog.style.cssText = 'background:#fff;border-radius:8px;max-width:600px;max-height:80vh;overflow-y:auto;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.3);';
      dialog.innerHTML =
        '<div style="display:flex;align-items:center;margin-bottom:12px;">' +
        '<h3 style="font-size:16px;flex:1;user-select:text;">' + escapeHtml(card.title || '') + '</h3>' +
        '<button style="padding:4px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;" onclick="this.closest(\'div[style*=fixed]\').remove()">关闭</button></div>' +
        '<div style="font-size:12px;color:#888;margin-bottom:10px;">状态：' + escapeHtml(card.status || '') + ' | v' + (card.version || 1) + ' | ' + escapeHtml(card.updated_at || '') + '</div>' +
        '<div style="font-size:14px;font-weight:600;margin-bottom:6px;">事实（' + (card.facts || []).length + ' 条，可选中复制）</div>' + factsHtml;
      overlay.appendChild(dialog);
      document.body.appendChild(overlay);
    } catch (e) { alert('查看失败：' + e.message); }
  };

  window._delKb = async function(slug, title) {
    if (!confirm('确认删除词条"' + title + '"？')) return;
    try {
      await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'delete', slug: slug }) });
      kbLoadTab();
    } catch (e) { alert('删除失败：' + e.message); }
  };

  // 清空
  $('btn-clear').onclick = function() {
    $('input-text').value = '';
    $('search-results').innerHTML = '<div class="empty-state">查证后在此显示结果</div>';
    $('report-area').innerHTML = '<div class="empty-state">查证后在此显示评级与纠错建议</div>';
    state.verify = null;
  };

  // 页面加载时从后端加载白名单（用于查询结果的白名单标签展示）
  try {
    var wlData = await apiFetch('/api/kb/submit', { method: 'POST', body: JSON.stringify({ action: 'get_whitelist' }) });
    state.whitelist = (wlData && wlData.whitelist) || [];
  } catch { state.whitelist = []; }

  console.log('事实查询 已加载');
})();
</script>
